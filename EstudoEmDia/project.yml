# Gere o EstudoEmDia.xcodeproj com: xcodegen generate
name: EstudoEmDia
options:
  bundleIdPrefix: com.lucasmaues
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    DEVELOPMENT_TEAM: X8Q64G6VT8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.1.1"
targets:
  EstudoEmDia:
    type: application
    platform: iOS
    sources:
      - path: EstudoEmDia
        excludes: ["GoogleService-Info.plist"]
    info:
      path: EstudoEmDia/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Desafio 1/3: permite receber push em segundo plano.
        UIBackgroundModes: [remote-notification]
        # Desligamos o swizzling do Firebase: o token APNs é repassado à mão no AppDelegate.
        FirebaseAppDelegateProxyEnabled: false
    entitlements:
      path: EstudoEmDia/EstudoEmDia.entitlements
      properties:
        aps-environment: development
    # GoogleService-Info.plist (baixado do Firebase Console) é opcional: copiado só se existir.
    # Como fonte normal, o Xcode falharia o build quando o arquivo faltasse.
    postCompileScripts:
      - name: Copiar GoogleService-Info.plist (opcional)
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/EstudoEmDia/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          else
            echo "warning: GoogleService-Info.plist ausente; o app abre, mas sem push."
          fi
    dependencies:
      - target: NotificationService
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmaues.estudoemdia
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Estudo em Dia
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Estudo em Dia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmaues.estudoemdia.NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Estudo em Dia
